header:
  version: 16
  includes:
    - kas/qbee-cos/wrynose.common.yml
machine: qemux86-64

target:
  - qemu-demo-bundle

repos:
  meta-rauc-community:
    layers:
      meta-rauc-qemux86:

local_conf_header:
  qemux86_64: |
    MACHINE_FEATURES:append = " pcbios efi"
    EXTRA_IMAGEDEPENDS += "ovmf"
    PREFERRED_RPROVIDER_virtual-grub-bootconf = "rauc-qemu-grubconf"

    # Hook file and type definition
    RAUC_BUNDLE_HOOKS[file] = "post-install.sh"
    RAUC_SLOT_rootfs[hooks] = "post-install"
